plugins {
    id 'java'
}

group = 'ru.netology.sql'
version = '1.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

compileJava.options.encoding = 'UTF-8'
compileTestJava.options.encoding = 'UTF-8'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'com.mysql:mysql-connector-j:8.4.0'
    testImplementation 'com.github.javafaker:javafaker:1.0.2'
    testImplementation 'commons-dbutils:commons-dbutils:1.7'
    testImplementation 'com.codeborne:selenide:6.19.1'
    testCompileOnly 'org.projectlombok:lombok:1.18.36'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.36'
}

test {
    useJUnitPlatform()

    // системные свойства
    systemProperty 'selenide.headless', System.getProperty('selenide.headless', 'false')
    systemProperty 'db.url', System.getProperty('db.url', 'jdbc:mysql://localhost:3306/app')
    systemProperty 'db.user', System.getProperty('db.user', 'app')
    systemProperty 'db.password', System.getProperty('db.password', 'pass')

    // отключаем попап "Смените пароль" / "Сохранить пароль" в Chrome 122+
    systemProperty 'chromeoptions.prefs', System.getProperty(
            'chromeoptions.prefs',
            'profile.password_manager_leak_detection=false,credentials_enable_service=false,profile.password_manager_enabled=false'
    )

    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
}